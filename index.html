<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <section class="section">
    <header class="header">
      <p class="heading">Monu's Portfolio</p>
      <button title="mode-switch" type="button" class="mode-switch"></button>
    </header>
    <div class="main">
      <div class="main-left">
        <img class="pfp" src="https://img.freepik.com/free-photo/man-wearing-denim-shirt-red-suspenders_273609-19392.jpg?size=626&ext=jpg&ga=GA1.1.1920040804.1700589225&semt=ais" alt="Profile Picture"/>
      </div>
      <div class="main-right">
        <div class="details">
          <span class="hello">Hello,</span>
          <p class="nameIntro">I am Monu</p>
          <p class="bio">I  am a B-Tech student and a Frontend Developer.</p>
          <button id="techStackBtn">My Tech Stack</button>
        </div>
    </div>
    <div class="contacts">
      <a href="#">
        <button title="github" type="button" class="bi bi-github github"></button>
      </a>
      <a href="#">
        <button title="linkedin" type="button" class="bi bi-linkedin"></button>
      </a>
      <a href="#">
        <button title="stack-overflow" type="button" class="bi bi-stack-overflow"></button>
      </a>
      <a href="#">
        <button title="instagram" type="button" class="bi bi-instagram"></button>
      </a>
      <a href="#">
        <button title="gmail" type="button" class="bi bi-envelope"></button>
      </a>
    </div>
    </div>
  </section>

</body>
</html>
